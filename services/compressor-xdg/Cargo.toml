[package]
name = "compressor-xdg"
version = "0.1.0"
edition = "2021"
description = "Dogecoin light node and enrichment engine: resolves inputs and metaprotocol state, serves enriched blocks over gRPC"
license = "Apache-2.0"
repository = "https://github.com/maestro-org/maestro-dogecoin-indexer"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
debug = true

[dependencies]
gasket = { version = "^0.5", features = ["derive"] }
clap = { version = "4.3.0", features = ["derive"] }
config = { version = "0.13.3", default-features = false, features = [
    "toml",
    "json",
] }
rocksdb = { version = "0.22.0", default-features = false, features = [
    "multi-threaded-cf",
] }
tonic = { version = "0.11.0", features = ["tls"] }
tonic-web = "0.11.0"
miette = { version = "5.9.0", features = ["fancy"] }
tokio = { version = "1.36.0", features = ["rt", "rt-multi-thread"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
thiserror = "1.0.30"
hex = "0.4.3"
serde = "1.0.196"
async-trait = "0.1.68"
bincode = "1.3.3"
tempfile = "3.9.0"
prost = "0.12"
serde_with = "3.4.0"
futures-core = "0.3.30"
futures-util = "0.3.30"
async-stream = "0.3.5"
actix-web = "4"
bitcoin = { git = "https://github.com/maestro-org/rust-bitcoin", rev = "65ef51ccdbdf69beeb291fe165911b101d2ce29c", features = [
    "serde",
    "rand",
] }
ordinals = { git = "https://github.com/maestro-org/ord", rev = "6fdaae98893bea4d2e0ccdcdb9d24f25649358d1" }
real_bitcoin = { package = "bitcoin", version = "0.30.2", features = [
    "serde",
    "rand-std",
] }
real_ordinals = { package = "ordinals", version = "0.0.8" }

socket2 = "0.5.6"
ord-bitcoincore-rpc = "0.17.2"
ord = "0.18.5"
itertools = "0.13.0"
serde_json = "1.0.117"
uuid = { version = "1.8.0", features = ["v4"] }
anyhow = "1.0.86"
signal-hook = "0.3.17"
once_cell = "1.10"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.5"

[build-dependencies]
tonic-build = "0.11.0"

# Inherited lint debt: allowed to keep the release close to production code;
# burn down over time. CI runs clippy with -D warnings, so anything not
# listed stays enforced.
[lints.clippy]
clone_on_copy = "allow"
collapsible_if = "allow"
from_over_into = "allow"
large_enum_variant = "allow"
manual_is_multiple_of = "allow"
map_flatten = "allow"
needless_as_bytes = "allow"
needless_borrow = "allow"
needless_return = "allow"
new_without_default = "allow"
question_mark = "allow"
redundant_locals = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
unnecessary_cast = "allow"
unnecessary_mut_passed = "allow"
unnecessary_unwrap = "allow"
unused_unit = "allow"
useless_conversion = "allow"
useless_format = "allow"
len_zero = "allow"
identity_op = "allow"
map_identity = "allow"
explicit_auto_deref = "allow"
unused_enumerate_index = "allow"
ptr_arg = "allow"
chunks_exact_to_as_chunks = "allow"
legacy_numeric_constants = "allow"
unnecessary_lazy_evaluations = "allow"
needless_range_loop = "allow"
assign_op_pattern = "allow"

[lints.rust]
deprecated = "allow"
dead_code = "allow"
mismatched_lifetime_syntaxes = "allow"
